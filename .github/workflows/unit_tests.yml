name: Unit Tests

# Download a platform's test artifact, run ctest, and upload the JUnit
# results for aggregation. Called once per arch from build_all.yml.
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      artifact:
        description: Test artifact uploaded by the build leg
        required: true
        type: string
      test-dir:
        description: Built tests dir; defaults to build/tests, override for arch-separated builds
        required: false
        type: string
        default: build/tests

jobs:
  unit_tests:
    # Static "Unit Tests"; the per-arch label is the caller's job name, so the
    # graph shows e.g. "Windows x64 / Unit Tests".
    name: Unit Tests
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tests reach outside tests/ at runtime: tests/data (TEST_DATA_DIR) and
          # resources/profiles (PROFILES_DIR) by baked-in absolute path, plus
          # resources/info (nozzle data) via resources_dir() during a real slice.
          # Check out all of resources/ so no test hits a missing-file path.
          sparse-checkout: |
            .github
            scripts
            tests
            resources
      - name: Apt-Install Dependencies
        if: runner.os == 'Linux' && !vars.SELF_HOSTED
        uses: ./.github/actions/apt-install-deps
      - name: Restore Test Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"  # use most recent 4.3.x version
          useLocalCache: true
          useCloudCache: true
      - name: Unpackage and Run Unit Tests
        timeout-minutes: 20
        shell: bash
        run: |
          tar -xvf build_tests.tar
          # Every platform builds with a multi-config generator (build_linux.sh uses Ninja
          # Multi-Config), so ctest needs the config: without it, plain add_test() tests
          # lose their labels and report "Not Run".
          scripts/run_unit_tests.sh "${{ inputs.test-dir }}" Release
      # PillSlicer: report failing tests as annotations, readable through the API without the artifacts.
      - name: Annotate failed tests
        if: ${{ failure() }}
        shell: bash
        run: |
          PYBIN=$(command -v python3 || command -v python)
          "$PYBIN" - <<'PY' || true
          import xml.etree.ElementTree as ET
          def esc(s): return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          root = ET.parse('ctest_results.xml').getroot()
          for case in root.iter('testcase'):
              if case.get('status') in ('fail', 'failed') or case.find('failure') is not None:
                  out = case.findtext('system-out') or ''
                  lines = [l for l in out.splitlines() if l.strip()]
                  keep = [l for l in lines if any(k in l for k in ('FAILED', 'REQUIRE', 'CHECK', 'with expansion', 'with message', ' == ', ' > ', 'due to', 'test cases'))]
                  print('::error title=' + esc(case.get('name', '?')) + '::' + esc('\n'.join((keep or lines)[-40:])[:3500]))
          PY
      # PillSlicer: tests that measure something print a PILLSLICER_MEASURE line; show them on the run.
      - name: Report measurements
        if: ${{ always() }}
        shell: bash
        run: |
          [ -f ctest_results.xml ] || exit 0
          grep -o 'PILLSLICER_MEASURE[^<]*' ctest_results.xml | sed 's/^PILLSLICER_MEASURE /::notice title=Measure::/' | sort -u || true
      - name: Upload Test Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-logs-${{ inputs.artifact }}
          path: ${{ inputs.test-dir }}/**/*.log
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.artifact }}
          path: ctest_results.xml
          retention-days: 5
          if-no-files-found: warn
      - name: Delete Test Artifact
        if: success()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: ${{ inputs.artifact }}
